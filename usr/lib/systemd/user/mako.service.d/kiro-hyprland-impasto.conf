# Kiro: impasto is the notification server of this edition. mako comes along through kiro-wayland-dotfiles, and its
# D-Bus activation grabbed org.freedesktop.Notifications whenever an app notified before impasto was up at login;
# impasto then never got the name. Only refuse mako while Hyprland runs with this edition's config, so the waybar
# editions on the same machine keep mako.
[Service]
ExecCondition=/bin/sh -c '! pgrep -u "$(id -u)" -f "kiro-hyprland-impasto/hyprland.lua" >/dev/null'
